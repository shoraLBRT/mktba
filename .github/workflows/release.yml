# From habze (templates/): release-please opens the Release PR (version + CHANGELOG); merging it
# tags vX.Y.Z and publishes the GitHub Release. The checks on the Release PR are approved by the
# reusable workflow itself (GitHub holds runs on bot-opened PRs for approval).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  release:
    uses: shoraLBRT/habze/.github/workflows/release.yml@v1

  # X-02 (#64): a created release publishes its images (tagged with the version) and deploys them to
  # production. Called here rather than triggered by the release event: a release made with the
  # workflow token starts no other workflow. The production job is skipped until the owner sets
  # DEPLOY_PRODUCTION_ENABLED; the environment's required reviewers approve each deployment.
  deploy:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.tag_name }}
    secrets: inherit
