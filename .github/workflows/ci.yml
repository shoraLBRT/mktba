name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    # The full-text search tests (ArticleSearchTests) run against a real PostgreSQL: each test class
    # creates and drops its own database on this server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mktba
          POSTGRES_PASSWORD: mktba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mktba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MKTBA_TEST_DB_CONNECTION: Host=localhost;Port=5432;Username=mktba;Password=mktba_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # The solution is named explicitly: docker-compose.dcproj at the root makes a bare
      # `dotnet build` fail with MSB1011.
      - run: dotnet restore Mktba.sln
      - run: dotnet build Mktba.sln --no-restore --configuration Release
      - run: dotnet test Mktba.sln --no-build --configuration Release --verbosity minimal

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mktba.react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mktba.react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Size budget of the public article page's JavaScript; how to update it: scripts/check-bundle-size.mjs.
      - run: npm run size

  # FE<->BE contract: the committed OpenAPI document and the TypeScript types generated from it
  # must match the API. A drift fails here; a contract change the frontend does not handle fails
  # `tsc` in the frontend job.
  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mktba.react/package-lock.json
      - run: npm ci
        working-directory: mktba.react
      - run: npm run gen:api
        working-directory: mktba.react
      - name: Fail on contract drift
        run: |
          if [ -n "$(git status --porcelain -- mktba.react/src/shared/api)" ]; then
            git --no-pager diff -- mktba.react/src/shared/api
            echo "::error::The API contract is out of date. Run 'npm run gen:api' in mktba.react and commit the result."
            exit 1
          fi

  # E2E smoke (Playwright, chromium): a real API on a throwaway PostgreSQL. Playwright starts the
  # API and Vite itself; the admin password and the JWT signing key are generated per run.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mktba
          POSTGRES_PASSWORD: mktba_e2e
          POSTGRES_DB: mktba_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mktba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DB_CONNECTION: Host=localhost;Port=5432;Database=mktba_e2e;Username=mktba;Password=mktba_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mktba.react/package-lock.json
      - run: dotnet build Mktba.Api/Mktba.Api.csproj --configuration Release
      - run: npm ci
        working-directory: mktba.react
      - run: npx playwright install --with-deps chromium
        working-directory: mktba.react
      - name: Generate per-run secrets
        run: |
          echo "E2E_ADMIN_PASSWORD=$(openssl rand -base64 24)" >> "$GITHUB_ENV"
          echo "E2E_JWT_SIGNING_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: npm run test:e2e
        working-directory: mktba.react
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            mktba.react/playwright-report
            mktba.react/test-results
          retention-days: 14

  # The production images build and the stand's compose file is valid (X-01, #63). Build only,
  # nothing is pushed: publishing and deploying are X-02 (#64).
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy/docker-compose.yml
        run: |
          sed -e 's/^ACME_EMAIL=$/ACME_EMAIL=ci@example.com/' \
              -e 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' \
              -e 's/^JWT_SIGNING_KEY=$/JWT_SIGNING_KEY=ci/' \
              deploy/.env.example > "$RUNNER_TEMP/ci.env"
          docker compose -f deploy/docker-compose.yml --env-file "$RUNNER_TEMP/ci.env" config --quiet
      - name: Validate deploy/Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SITE_HOST=mktba.example -e API_HOST=api.mktba.example -e ACME_EMAIL=ci@example.com \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build the API image
        run: docker build --file Mktba.Api/Dockerfile --tag mktba-api:ci .
      - name: Build the web image
        run: docker build --build-arg VITE_API_BASE_URL=https://api.mktba.example --tag mktba-web:ci mktba.react
      - name: Check the deploy and backup scripts
        run: shellcheck deploy/deploy.sh deploy/backup.sh scripts/test-deploy.sh scripts/test-backup.sh
      # X-02 (#64): deploy, redeploy and roll back a throwaway stand built from these images.
      - name: Test deploy/deploy.sh
        run: bash scripts/test-deploy.sh
      # X-04 (#158): scheduled backup, restore check (also of a broken backup), restore, rotation.
      - name: Test deploy/backup.sh
        run: bash scripts/test-backup.sh

  # Lints every workflow (and the shell in their run steps) with actionlint.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
