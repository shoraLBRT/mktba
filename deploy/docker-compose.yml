# The whole stand (X-01, #63): Caddy (TLS, reverse proxy) -> web (SSR) and api -> postgres.
# One file for staging and production; the stand is chosen by deploy/.env (see .env.example):
#   cp deploy/.env.example deploy/.env    # fill in, never commit
#   docker compose -f deploy/docker-compose.yml up -d --build
# CI deploys published images with deploy/deploy.sh instead (X-02, #64; README «Деплой из CI»).
# The root docker-compose.yml stays the local-development database only.

name: ${COMPOSE_PROJECT_NAME:-mktba}

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=mktba;Username=mktba;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
  Auth__JwtSigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in deploy/.env}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mktba
      POSTGRES_USER: mktba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mktba -d mktba"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  # Backups of the database and the uploads (X-04, #158; deploy/backup.sh, README «Резервные копии»):
  # crond runs one on BACKUP_SCHEDULE (UTC) into BACKUP_HOST_DIR on the host, deploy.sh makes one
  # before every migration and has `backup`, `verify` (restore check) and `restore`. Same image as
  # the database, so pg_dump matches the server.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/mktba-backup"]
    command: ["schedule"]
    environment:
      PGHOST: postgres
      PGUSER: mktba
      PGDATABASE: mktba
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-0 3 * * *}"
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_KEEP_PRE_DEPLOY: ${BACKUP_KEEP_PRE_DEPLOY:-5}
      # Off-site copy, off while empty (see deploy/.env.example).
      BACKUP_OFFSITE_COMMAND: ${BACKUP_OFFSITE_COMMAND:-}
      BACKUP_PACKAGES: ${BACKUP_PACKAGES:-}
    volumes:
      - ./backup.sh:/usr/local/bin/mktba-backup:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
      # Config and keys of the off-site copy (rclone.conf, an SSH key); created empty if missing.
      - ./backup-offsite:/offsite:ro
      # Read-write: `restore` puts the uploads back.
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  # Applies the migrations and the reference data, then exits (X-03): the API itself never migrates
  # outside Development.
  migrate:
    image: ${MKTBA_IMAGE_PREFIX:-mktba}-api:${MKTBA_TAG:-local}
    build:
      context: ..
      dockerfile: Mktba.Api/Dockerfile
    command: ["--migrate"]
    restart: "no"
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    image: ${MKTBA_IMAGE_PREFIX:-mktba}-api:${MKTBA_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *api-environment
      # The browser calls the API from the site's origin with the refresh cookie.
      Cors__AllowedOrigins__0: https://${SITE_HOST:?set SITE_HOST in deploy/.env}
      # Caddy is the only proxy in front of the API; it sets X-Forwarded-For and X-Forwarded-Proto.
      ForwardedHeaders__KnownNetworks__0: ${PROXY_SUBNET:-172.30.63.0/24}
      Uploads__PublicBaseUrl: https://${API_HOST:?set API_HOST in deploy/.env}/files/
      Storage__Provider: Local
      Storage__Local__RootPath: /app/App_Data/uploads
      Feedback__SiteUrl: https://${SITE_HOST}
      Feedback__GitHub__PrivateKey: ${FEEDBACK_GITHUB_PRIVATE_KEY:-}
      # IndexNow (O-12, #61): empty key = off. The site serves the key at /indexnow-key.txt.
      IndexNow__Key: ${INDEXNOW_KEY:-}
      IndexNow__SiteUrl: https://${SITE_HOST}
      # Alerts to the owner's Telegram chat (X-05, #159): off while the token or the chat is empty.
      Alerts__Stand: ${ALERT_STAND:-}
      Alerts__Telegram__BotToken: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      Alerts__Telegram__ChatId: ${ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - uploads:/app/App_Data/uploads
    # Readiness (X-05, #159): the database reachable and fully migrated. The runtime image has no
    # curl, so the API's own binary asks GET /health/ready; deploy.sh's `up --wait` waits for it.
    healthcheck:
      test: ["CMD", "dotnet", "Mktba.Api.dll", "--health-probe"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, proxy]

  web:
    # Built per stand (VITE_* are baked in), so CI tags it <tag>-<stand>: MKTBA_WEB_TAG_SUFFIX is
    # -staging or -production (X-02, #64), empty for a local build.
    image: ${MKTBA_IMAGE_PREFIX:-mktba}-web:${MKTBA_TAG:-local}${MKTBA_WEB_TAG_SUFFIX:-}
    build:
      context: ../mktba.react
      args:
        VITE_API_BASE_URL: https://${API_HOST}
        VITE_METRIKA_ID: ${METRIKA_ID:-}
    restart: unless-stopped
    environment:
      PORT: "3000"
      API_INTERNAL_URL: http://api:8080
      PUBLIC_SITE_URL: https://${SITE_HOST}
      # Webmaster verification meta tags (O-12, #61); empty = no tag.
      YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    # The SSR server answers (robots.txt is rendered by it without calling the API).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    networks: [proxy]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST}
      API_HOST: ${API_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    networks: [proxy]

networks:
  # Not reachable from outside: only Caddy publishes ports.
  backend:
  # Fixed subnet: the API trusts X-Forwarded-* only from here (ForwardedHeaders:KnownNetworks).
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.63.0/24}

volumes:
  pgdata:
  # Uploaded images (Storage:Provider=Local until the beta); the backup service saves it together
  # with the database.
  uploads:
  # Caddy's certificates and ACME account: losing it means re-issuing every certificate.
  caddy_data:
  caddy_config:
