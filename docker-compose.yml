services:
  postgres:
    image: postgres:16-alpine
    container_name: mktba_postgres
    environment:
      POSTGRES_DB: mktba
      POSTGRES_USER: mktba
      POSTGRES_PASSWORD: mktba_dev
    ports:
      - "5432:5432"
    volumes:
      - mktba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mktba -d mktba"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mktba_pgdata:
